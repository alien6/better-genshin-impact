name: PT-BR localization audit

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  xaml-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find untranslated visible XAML literals
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          pt_path = Path('BetterGenshinImpact/User/I18n/pt-BR.json')
          pt = json.loads(pt_path.read_text(encoding='utf-8-sig'))
          cjk = re.compile(r'[\u3400-\u9fff]')
          quoted = re.compile(r'(?P<q>["\'])(?P<v>(?:\\.|(?!\1).)*)\1')
          textnode = re.compile(r'>([^<>]*[\u3400-\u9fff][^<>]*)<')
          attr_name = re.compile(r'([\w:.]+)\s*=\s*$')
          ignore_attrs = {'x:Class','xmlns','xmlns:x','xmlns:d','xmlns:mc','mc:Ignorable','d:DataContext','Source','UriSource'}
          results=[]
          for path in sorted(Path('BetterGenshinImpact/View').rglob('*.xaml')):
              content = path.read_text(encoding='utf-8-sig', errors='ignore')
              auto = 'AutoTranslateInterceptor.EnableAutoTranslate="True"' in content
              for lineno,line in enumerate(content.splitlines(),1):
                  if line.lstrip().startswith('<!--'):
                      continue
                  for m in quoted.finditer(line):
                      value=m.group('v').strip()
                      if not cjk.search(value) or value in pt:
                          continue
                      prefix=line[:m.start()]
                      am=attr_name.search(prefix)
                      attr=am.group(1) if am else '?'
                      if attr in ignore_attrs or attr.startswith('xmlns'):
                          continue
                      if any(x in value for x in ('clr-namespace:', '{Binding', '{StaticResource', '{DynamicResource', 'pack://')):
                          continue
                      results.append((str(path),lineno,attr,value,auto))
                  for m in textnode.finditer(line):
                      value=m.group(1).strip()
                      if value and value not in pt:
                          results.append((str(path),lineno,'#text',value,auto))

          # unique by file/line/attribute/value
          seen=set(); unique=[]
          for item in results:
              key=item[:4]
              if key not in seen:
                  seen.add(key); unique.append(item)
          print('VISIBLE_XAML_MISSING_COUNT='+str(len(unique)))
          for path,line,attr,value,auto in unique:
              print('XAML_MISSING='+json.dumps({'file':path,'line':line,'attr':attr,'text':value,'auto_translate_root':auto},ensure_ascii=False))
          PY
