name: PT-BR localization audit

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  xaml-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download official Genshin TextMaps
        shell: bash
        run: |
          curl -L --fail --retry 3 -o /tmp/TextMapCHS.json https://raw.githubusercontent.com/DimbreathBot/AnimeGameData/master/TextMap/TextMapCHS.json
          curl -L --fail --retry 3 -o /tmp/TextMapPT.json https://raw.githubusercontent.com/DimbreathBot/AnimeGameData/master/TextMap/TextMapPT.json
      - name: Build enriched XAML gap report
        shell: bash
        run: |
          python3 - <<'PY'
          import difflib
          import json
          import re
          import xml.etree.ElementTree as ET
          from collections import defaultdict
          from pathlib import Path

          pt = json.loads(Path('BetterGenshinImpact/User/I18n/pt-BR.json').read_text(encoding='utf-8-sig'))
          chs = json.loads(Path('/tmp/TextMapCHS.json').read_text(encoding='utf-8-sig'))
          offpt = json.loads(Path('/tmp/TextMapPT.json').read_text(encoding='utf-8-sig'))
          official=defaultdict(set)
          for k,v in chs.items():
              pv=offpt.get(k)
              if isinstance(v,str) and isinstance(pv,str) and v.strip() and pv.strip():
                  official[v].add(pv)

          cjk = re.compile(r'[\u3400-\u9fff]')
          report = defaultdict(list)
          def local(tag): return tag.rsplit('}',1)[-1] if '}' in tag else tag

          for path in sorted(Path('BetterGenshinImpact/View').rglob('*.xaml')):
              raw=path.read_text(encoding='utf-8-sig',errors='ignore')
              try: root=ET.fromstring(raw)
              except Exception: continue
              parent={child:par for par in root.iter() for child in par}
              root_auto='AutoTranslateInterceptor.EnableAutoTranslate="True"' in raw
              root_kind=local(root.tag)
              for elem in root.iter():
                  ancestors=[]; cur=elem
                  while cur in parent:
                      cur=parent[cur]; ancestors.append(local(cur.tag))
                  in_combo=any(a in {'ComboBox','ComboBoxItem'} for a in ancestors) or local(elem.tag) in {'ComboBox','ComboBoxItem'}
                  vals=[]
                  for attr,value in elem.attrib.items():
                      if not isinstance(value,str): continue
                      value=value.strip(); attr_local=local(attr)
                      if not value or not cjk.search(value) or value in pt: continue
                      if attr_local in {'Class','DataContext','Name','Source','UriSource'}: continue
                      if any(x in value for x in ('{Binding','{StaticResource','{DynamicResource','clr-namespace:','pack://')): continue
                      vals.append((attr_local,value))
                  if elem.text:
                      value=elem.text.strip()
                      if value and cjk.search(value) and value not in pt: vals.append(('#text',value))
                  for attr,value in vals:
                      report[value].append({'file':str(path),'element':local(elem.tag),'attr':attr,'root_kind':root_kind,'root_auto':root_auto,'in_combo':in_combo})

          existing_keys=list(pt.keys())
          data=[]
          for text,occ in sorted(report.items()):
              exact=official.get(text,set())
              official_value=next(iter(exact)) if len(exact)==1 else None
              fuzzy=[]
              for match in difflib.get_close_matches(text,existing_keys,n=3,cutoff=.70):
                  fuzzy.append({'source':match,'translation':pt[match],'ratio':round(difflib.SequenceMatcher(None,text,match).ratio(),3)})
              data.append({'text':text,'official_pt':official_value,'fuzzy':fuzzy,'occurrences':occ,'standalone_unscoped':any(o['root_kind'] in {'Window','FluentWindow'} and not o['root_auto'] for o in occ),'in_combo':any(o['in_combo'] for o in occ)})
          Path('/tmp/xaml-gaps-enriched.json').write_text(json.dumps(data,ensure_ascii=False,indent=2),encoding='utf-8')
          print('UNIQUE_XAML_GAP_COUNT='+str(len(data)))
          print('OFFICIAL_TEXTMAP_MATCHES='+str(sum(1 for x in data if x['official_pt'])))
          print('STANDALONE_UNSCOPED='+str(sum(1 for x in data if x['standalone_unscoped'])))
          print('IN_COMBO='+str(sum(1 for x in data if x['in_combo'])))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ptbr-xaml-gaps-enriched
          path: |
            /tmp/xaml-gaps-enriched.json
            /tmp/TextMapCHS.json
            /tmp/TextMapPT.json