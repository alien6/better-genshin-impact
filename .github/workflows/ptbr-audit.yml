name: PT-BR localization audit

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  comprehensive-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare catalogs and scan user-visible source strings
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          root = Path('BetterGenshinImpact')
          i18n = root / 'User' / 'I18n'
          catalogs = {}
          for name in ('en', 'ja', 'pt-BR'):
              with (i18n / f'{name}.json').open('r', encoding='utf-8-sig') as f:
                  catalogs[name] = json.load(f)

          pt = catalogs['pt-BR']
          for name in ('en', 'ja'):
              missing = [k for k in catalogs[name] if k not in pt or not str(pt[k]).strip()]
              print(f'{name.upper()}_COUNT={len(catalogs[name])}')
              print(f'MISSING_FROM_{name.upper()}={len(missing)}')
              for key in missing[:200]:
                  print(f'MISSING_{name.upper()}=' + json.dumps(key, ensure_ascii=False))

          cjk = re.compile(r'[\u3400-\u9fff]')
          quoted = re.compile(r'(?P<q>["\'])(?P<body>(?:\\.|(?!\1).)*?[\u3400-\u9fff](?:\\.|(?!\1).)*?)\1')
          candidates = {}
          scan_exts = {'.xaml', '.cs'}
          scan_roots = [root / 'View', root / 'ViewModel', root / 'Service', root / 'Core', root / 'GameTask']

          for base in scan_roots:
              if not base.exists():
                  continue
              for path in base.rglob('*'):
                  if path.suffix.lower() not in scan_exts:
                      continue
                  try:
                      text = path.read_text(encoding='utf-8-sig', errors='ignore')
                  except Exception:
                      continue
                  for m in quoted.finditer(text):
                      value = m.group('body')
                      value = value.replace('\\"', '"').replace("\\'", "'").replace('\\r\\n', '\r\n').replace('\\n', '\n')
                      if not cjk.search(value):
                          continue
                      if value in pt:
                          continue
                      # Ignore namespaces, URLs, file paths, regex-heavy literals and comments accidentally captured.
                      if any(token in value for token in ('clr-namespace:', 'http://', 'https://', '\\\\', '.png', '.json', '.xaml')):
                          continue
                      if len(value) > 300:
                          continue
                      candidates.setdefault(value, set()).add(str(path))

          print(f'SOURCE_CJK_LITERAL_NOT_IN_PT_COUNT={len(candidates)}')
          for value, paths in list(sorted(candidates.items(), key=lambda x: (len(x[0]), x[0])))[:300]:
              print('SOURCE_CANDIDATE=' + json.dumps({'text': value, 'files': sorted(paths)[:5]}, ensure_ascii=False))

          if any(k not in pt or not str(pt[k]).strip() for k in catalogs['en']):
              raise SystemExit(1)
          PY
