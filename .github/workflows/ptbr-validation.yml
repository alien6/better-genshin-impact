name: PT-BR Validation

on:
  push:
    branches:
      - feature/pt-br-support
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify complete PT-BR UI dictionary
        run: python tools/generate_ptbr_ui.py --check

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore BetterGenshinImpact.sln

      - name: Build
        run: dotnet build BetterGenshinImpact.sln -c Debug --no-restore

      - name: Test PT-BR localization
        run: dotnet test Test/BetterGenshinImpact.UnitTest/BetterGenshinImpact.UnitTest.csproj -c Debug --no-build --filter "FullyQualifiedName~GameTextCatalogTests|FullyQualifiedName~GameLiteralCatalogTests|FullyQualifiedName~PaddleOcrCultureTests|FullyQualifiedName~SupportedCulturesTests|FullyQualifiedName~GenshinLocalizationApiTests|FullyQualifiedName~LegacyScriptTextResolverTests|FullyQualifiedName~LegacyScriptLocalizationCompatibilityTests"
