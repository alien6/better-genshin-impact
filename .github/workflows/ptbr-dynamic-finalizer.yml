name: PT-BR dynamic binding finalizer

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Merge final PT-BR catalog and runtime coverage
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from collections import Counter
          import json
          import re

          pt_path = Path('BetterGenshinImpact/User/I18n/pt-BR.json')
          pt = json.loads(pt_path.read_text(encoding='utf-8-sig'))
          before = len(pt)

          part_paths = sorted(Path('.github').glob('ptbr-ui439-part*.json'))
          if len(part_paths) != 6:
              raise SystemExit(f'Expected 6 final translation parts, found {len(part_paths)}')

          updates = {}
          for path in part_paths:
              data = json.loads(path.read_text(encoding='utf-8-sig'))
              for key, value in data.items():
                  if key in updates and updates[key] != value:
                      raise SystemExit(f'Conflicting staged translation: {key}')
                  updates[key] = value

          if len(updates) != 444:
              raise SystemExit(f'Expected 444 unique final translations, found {len(updates)}')

          extra_path = Path('.github/ptbr-ui-sinks-extra.json')
          if not extra_path.exists():
              raise SystemExit('Missing .github/ptbr-ui-sinks-extra.json')
          extra = json.loads(extra_path.read_text(encoding='utf-8-sig'))
          if len(extra) != 140:
              raise SystemExit(f'Expected 140 extra user-visible translations, found {len(extra)}')

          han = re.compile(r'[\u3400-\u9fff]')
          placeholder = re.compile(r'\{[^{}]+\}')

          def validate_stage(stage_name, data):
              for key, value in data.items():
                  if not isinstance(value, str) or not value.strip():
                      raise SystemExit(f'{stage_name}: empty translation: {key}')
                  if han.search(value):
                      raise SystemExit(f'{stage_name}: PT-BR value still contains Han characters: {key} => {value}')
                  if Counter(placeholder.findall(key)) != Counter(placeholder.findall(value)):
                      raise SystemExit(f'{stage_name}: placeholder mismatch: {key} => {value}')

          validate_stage('final-stage', updates)
          validate_stage('extra-stage', extra)

          def merge_stage(stage_name, data):
              overlap = set(data) & set(pt)
              changed_overlap = [k for k in overlap if pt[k] != data[k]]
              if changed_overlap:
                  raise SystemExit(f'{stage_name}: unexpected overwrite: {changed_overlap[:5]}')
              new_keys = set(data) - set(pt)
              pt.update(data)
              print(f'{stage_name.upper().replace("-", "_")}_COUNT={len(data)}')
              print(f'{stage_name.upper().replace("-", "_")}_OVERLAP={len(overlap)}')
              print(f'{stage_name.upper().replace("-", "_")}_NEW={len(new_keys)}')

          merge_stage('final-stage', updates)
          merge_stage('extra-stage', extra)

          if len(pt) < before:
              raise SystemExit(f'Catalog shrank unexpectedly: before={before}, after={len(pt)}')

          pt_path.write_text(json.dumps(pt, ensure_ascii=False, indent=2) + '\n', encoding='utf-8-sig')
          print(f'PT_COUNT_BEFORE={before}')
          print(f'PT_COUNT_AFTER={len(pt)}')

          service_path = Path('BetterGenshinImpact/Service/JsonTranslationService.cs')
          src = service_path.read_text(encoding='utf-8-sig')

          if 'using System.Text.RegularExpressions;' not in src:
              src = src.replace('using System.Text;\n', 'using System.Text;\nusing System.Text.RegularExpressions;\n', 1)

          exact_block = (
              '        if (_map.TryGetValue(text, out var translated) && !string.IsNullOrWhiteSpace(translated))\n'
              '        {\n'
              '            return translated;\n'
              '        }\n\n'
              '        var normalizedSource = NormalizeSourceInfo(sourceInfo);\n'
          )
          exact_replacement = (
              '        if (_map.TryGetValue(text, out var translated) && !string.IsNullOrWhiteSpace(translated))\n'
              '        {\n'
              '            return translated;\n'
              '        }\n\n'
              '        if (TryTranslateTemplate(text, _map, out translated))\n'
              '        {\n'
              '            return translated;\n'
              '        }\n\n'
              '        var normalizedSource = NormalizeSourceInfo(sourceInfo);\n'
          )
          if 'if (TryTranslateTemplate(text, _map, out translated))' not in src:
              if exact_block not in src:
                  raise SystemExit('Translate insertion point not found')
              src = src.replace(exact_block, exact_replacement, 1)

          helper_lines = [
              '    private static bool TryTranslateTemplate(',
              '        string text,',
              '        IReadOnlyDictionary<string, string> map,',
              '        out string translated)',
              '    {',
              '        translated = text;',
              '',
              '        foreach (var pair in map)',
              '        {',
              '            var sourceTemplate = pair.Key;',
              '            var targetTemplate = pair.Value;',
              '            if (string.IsNullOrWhiteSpace(targetTemplate)',
              "                || sourceTemplate.IndexOf('{') < 0",
              "                || sourceTemplate.IndexOf('}') < 0)",
              '            {',
              '                continue;',
              '            }',
              '',
              '            var placeholders = Regex.Matches(sourceTemplate, @"\\{([^{}]+)\\}");',
              '            if (placeholders.Count == 0)',
              '            {',
              '                continue;',
              '            }',
              '',
              '            var first = placeholders[0];',
              '            if (first.Index > 0',
              '                && !text.StartsWith(sourceTemplate[..first.Index], StringComparison.Ordinal))',
              '            {',
              '                continue;',
              '            }',
              '',
              '            var last = placeholders[^1];',
              '            var suffixStart = last.Index + last.Length;',
              '            if (suffixStart < sourceTemplate.Length',
              '                && !text.EndsWith(sourceTemplate[suffixStart..], StringComparison.Ordinal))',
              '            {',
              '                continue;',
              '            }',
              '',
              '            var pattern = new StringBuilder("^");',
              '            var cursor = 0;',
              '            for (var i = 0; i < placeholders.Count; i++)',
              '            {',
              '                var item = placeholders[i];',
              '                pattern.Append(Regex.Escape(sourceTemplate[cursor..item.Index]));',
              '                pattern.Append("(?<p").Append(i).Append(">.*?)");',
              '                cursor = item.Index + item.Length;',
              '            }',
              "            pattern.Append(Regex.Escape(sourceTemplate[cursor..])).Append('$');",
              '',
              '            var match = Regex.Match(',
              '                text,',
              '                pattern.ToString(),',
              '                RegexOptions.Singleline | RegexOptions.CultureInvariant);',
              '            if (!match.Success)',
              '            {',
              '                continue;',
              '            }',
              '',
              '            var result = targetTemplate;',
              '            for (var i = 0; i < placeholders.Count; i++)',
              '            {',
              '                result = result.Replace(',
              '                    placeholders[i].Value,',
              '                    match.Groups[$"p{i}"].Value,',
              '                    StringComparison.Ordinal);',
              '            }',
              '',
              '            translated = result;',
              '            return true;',
              '        }',
              '',
              '        return false;',
              '    }',
              ''
          ]
          helper = '\n'.join(helper_lines) + '\n'
          marker = '    private void EnsureMapLoaded(string cultureName)\n'
          if 'private static bool TryTranslateTemplate(' not in src:
              if marker not in src:
                  raise SystemExit('EnsureMapLoaded insertion point not found')
              src = src.replace(marker, helper + marker, 1)

          service_path.write_text(src, encoding='utf-8-sig')

          interceptor_path = Path('BetterGenshinImpact/View/Behavior/AutoTranslateInterceptor.cs')
          interceptor = interceptor_path.read_text(encoding='utf-8-sig')
          old_loaded = '''        private static void OnAnyElementLoaded(object sender, RoutedEventArgs e)\n        {\n            if (sender is not DependencyObject obj)\n            {\n                return;\n            }\n\n            FindNearestScope(obj)?.RequestApply(obj);\n        }\n'''
          new_loaded = '''        private static void OnAnyElementLoaded(object sender, RoutedEventArgs e)\n        {\n            if (sender is not DependencyObject obj)\n            {\n                return;\n            }\n\n            // Programmatically created top-level windows do not inherit an XAML translation scope.\n            // Enable one only when the window has not explicitly opted in or out.\n            if (obj is Window window\n                && window.ReadLocalValue(EnableAutoTranslateProperty) == DependencyProperty.UnsetValue\n                && window.GetValue(ScopeProperty) is not Scope)\n            {\n                SetEnableAutoTranslate(window, true);\n                return;\n            }\n\n            FindNearestScope(obj)?.RequestApply(obj);\n        }\n'''
          if 'window.ReadLocalValue(EnableAutoTranslateProperty) == DependencyProperty.UnsetValue' not in interceptor:
              if old_loaded not in interceptor:
                  raise SystemExit('OnAnyElementLoaded patch point not found')
              interceptor = interceptor.replace(old_loaded, new_loaded, 1)
          interceptor_path.write_text(interceptor, encoding='utf-8-sig')
          PY

      - name: Verify final integration shape
        shell: bash
        run: |
          grep -q 'TryTranslateTemplate(text, _map' BetterGenshinImpact/Service/JsonTranslationService.cs
          grep -q 'Regex.Matches(sourceTemplate' BetterGenshinImpact/Service/JsonTranslationService.cs
          grep -q 'TranslateBoundCurrentValue' BetterGenshinImpact/View/Behavior/AutoTranslateInterceptor.cs
          grep -q 'ReadLocalValue(EnableAutoTranslateProperty) == DependencyProperty.UnsetValue' BetterGenshinImpact/View/Behavior/AutoTranslateInterceptor.cs

      - name: Commit product changes
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add BetterGenshinImpact/User/I18n/pt-BR.json BetterGenshinImpact/Service/JsonTranslationService.cs BetterGenshinImpact/View/Behavior/AutoTranslateInterceptor.cs
          git commit -m 'feat(i18n): complete PT-BR runtime UI translations'
          git push origin HEAD:${{ github.head_ref }}
