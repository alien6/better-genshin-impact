name: Apply PT-BR CSharp UI delta

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Merge reviewed CSharp UI translations
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          catalog_path = Path('BetterGenshinImpact/User/I18n/pt-BR.json')
          part_paths = sorted(Path('.github').glob('ptbr-csharp-ui.part*.json'))
          workflow_path = Path('.github/workflows/ptbr-csharp-merge.yml')

          if len(part_paths) != 6:
              raise SystemExit(f'Expected 6 translation parts, got {len(part_paths)}')

          delta = {}
          duplicates = []
          for path in part_paths:
              part = json.loads(path.read_text(encoding='utf-8-sig'))
              for source, target in part.items():
                  if source in delta:
                      duplicates.append(source)
                  delta[source] = target

          if duplicates:
              raise SystemExit(f'Duplicate sources between parts: {duplicates[:10]}')
          if len(delta) != 441:
              raise SystemExit(f'Expected 441 reviewed CSharp UI translations, got {len(delta)}')

          catalog = json.loads(catalog_path.read_text(encoding='utf-8-sig'))
          han = re.compile(r'[\u3400-\u9fff]')
          placeholder = re.compile(r'\{[^{}]+\}')
          collisions = []
          bad_placeholders = []
          bad_han = []

          for source, target in delta.items():
              if source in catalog and catalog[source] != target:
                  collisions.append((source, catalog[source], target))
              if placeholder.findall(source) != placeholder.findall(target):
                  bad_placeholders.append((source, target))
              if han.search(target):
                  bad_han.append((source, target))

          if collisions:
              raise SystemExit(f'Unexpected catalog collisions: {collisions[:5]}')
          if bad_placeholders:
              raise SystemExit(f'Placeholder mismatch: {bad_placeholders[:5]}')
          if bad_han:
              raise SystemExit(f'Unexpected Han in PT-BR targets: {bad_han[:5]}')

          before = len(catalog)
          catalog.update(delta)
          catalog_path.write_text(json.dumps(catalog, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          for path in part_paths:
              path.unlink()
          workflow_path.unlink()

          print(f'PT-BR CSharp UI catalog: {before} -> {len(catalog)} keys (+{len(delta)})')
          PY

      - name: Commit merged translations
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(i18n): translate dynamic CSharp UI text"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
